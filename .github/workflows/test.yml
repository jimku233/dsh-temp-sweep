name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 连续推送时取消同分支上未完成的运行，避免排队堆积。
#
# 与 workflow-visualizer 的差别：那边是 cancel-in-progress: ${{ github.event_name == 'pull_request' }}，
# 只在 PR 上取消，main 的每个提交仍各自校验一遍。这个仓库的堆积恰恰发生在 main 的连推上
# （2026-10-22 连推 4 次，队列排了两轮），所以 main 也取消 —— 被取代的提交本来就会被紧随的
# 提交覆盖，而标签与 Release 只打在「CI 通过的那个提交」上，校验义务没有丢。
# 若要回到只在 PR 取消，把下面一行换成上面那个表达式即可。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no dependencies to install)
        run: node --version
      - name: Test
        run: node tools/test.mjs
      - name: Release gate (artifacts / secrets / version)
        if: matrix.node == 22
        run: node tools/check-release.mjs --skip-tests
      - name: CLI help
        run: node bin/sweep.mjs --help
      - name: Refuse a catch-all pattern
        shell: bash
        run: |
          set +e
          node bin/sweep.mjs --patterns '*' --json > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test $code -ne 0
